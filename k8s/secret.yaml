# K8s Secret — full DATABASE_DSN and other sensitive values.
# Replace <base64-encoded-value> with the actual base64-encoded secret.
# Generate with: echo -n "postgres://user:password@host:5432/db?sslmode=disable" | base64
apiVersion: v1
kind: Secret
metadata:
  name: md-backend-secret
  namespace: marketdata
type: Opaque
data:
  DATABASE_DSN: <base64-encoded-database-dsn>
