# K8s Secret — full DATABASE_DSN and other sensitive values.
#
# stringData avoids manual base64 encoding; Kubernetes encodes values at apply
# time. For production, replace the DSN below or use a sealed-secret / external-
# secrets operator.
#
# The DSN host should point to the PostgreSQL Service in the same namespace,
# e.g. postgres.marketdata.svc.cluster.local:5432.
apiVersion: v1
kind: Secret
metadata:
  name: md-backend-secret
  namespace: marketdata
type: Opaque
stringData:
  DATABASE_DSN: "postgres://marketdata:marketdata@postgres.marketdata.svc.cluster.local:5432/marketdata?sslmode=disable"
