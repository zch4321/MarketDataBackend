# K8s Secret — database password and other sensitive values.
# Replace <base64-encoded-value> with the actual base64-encoded secret.
# Generate with: echo -n "your-password" | base64
apiVersion: v1
kind: Secret
metadata:
  name: md-backend-secret
  namespace: marketdata
type: Opaque
data:
  DB_PASSWORD: <base64-encoded-database-password>
