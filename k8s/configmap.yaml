# K8s ConfigMap — runtime configuration shared by both services.
#
# Every key here maps 1:1 to an environment variable read by the Go config
# loader (see internal/config/config.go). Values that differ per Deployment
# (e.g. MODE) are set directly in the Pod spec and override these defaults.
#
# Kafka bootstrap brokers:
#   - Single-node dev:  "kafka.marketdata.svc.cluster.local:9092"
#   - Strimzi / multi-broker StatefulSet:
#       "kafka-0.kafka.marketdata.svc.cluster.local:9092,kafka-1.kafka…"
#   - External (host):  "host.docker.internal:19090" (Docker Desktop only)
apiVersion: v1
kind: ConfigMap
metadata:
  name: md-backend-config
  namespace: marketdata
data:
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  DB_CONNECT_TIMEOUT: "5s"
  KAFKA_BROKERS: "kafka.marketdata.svc.cluster.local:9092"
  RUNTIME_MAX_GROUPS: "50"
  RUNTIME_MAX_WEIGHT: "500"
  LEASE_TTL: "30s"
  LEASE_RENEW_INTERVAL: "10s"
  RECONCILE_INTERVAL: "5s"
  HEARTBEAT_INTERVAL: "10s"
  SHUTDOWN_TIMEOUT: "20s"
  INPUT_STATUS_REPORT_INTERVAL: "1s"
  INPUT_RECONCILE_INTERVAL: "2s"
  TRADE_BATCH_SIZE: "500"
  TRADE_BATCH_FLUSH_INTERVAL: "100ms"
  KLINE_BATCH_SIZE: "100"
  KLINE_BATCH_FLUSH_INTERVAL: "500ms"
  ORDERBOOK_DELTA_BATCH_SIZE: "2000"
  ORDERBOOK_DELTA_FLUSH_INTERVAL: "100ms"
  ORDERBOOK_SNAPSHOT_INTERVAL: "1m"
  ORDERBOOK_DELTA_RETENTION: "72h"
  ORDERBOOK_DELTA_PARTITION_INTERVAL: "1h"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
