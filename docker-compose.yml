name: market-data-backend

# Local PostgreSQL and Kafka dependencies.
#
# Start:
#   docker compose up -d --wait
#
# Run all Go tests against PostgreSQL (PowerShell):
#   $env:TEST_DATABASE_DSN = "postgres://marketdata:marketdata@127.0.0.1:55432/marketdata?sslmode=disable"
#   $env:TEST_KAFKA_BROKERS = "127.0.0.1:19092"
#   $env:GOCACHE = "$PWD\.gocache"
#   go test ./...
#
# Kafka clients running on the host use localhost:19092. Containers on this
# Compose network use kafka:19092.
#
# Stop while preserving PostgreSQL data:
#   docker compose down
#
# Reset all local data:
#   docker compose down -v

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketdata}
      POSTGRES_DB: ${POSTGRES_DB:-marketdata}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    shm_size: 128mb
    volumes:
      # PostgreSQL 18+ uses /var/lib/postgresql as the image volume root.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-marketdata} -d ${POSTGRES_DB:-marketdata}",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.0}
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_PORT:-19092},PLAINTEXT://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

volumes:
  postgres-data:
